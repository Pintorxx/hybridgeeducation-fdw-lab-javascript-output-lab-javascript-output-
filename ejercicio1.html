<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar párrafo con JavaScript</title>
    <style>
        /* Estilos modernos y minimalistas */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 3rem 2.5rem;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 20, 40, 0.2), 
                        0 8px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
            text-align: center;
        }

        .card:hover {
            box-shadow: 0 30px 50px rgba(0, 20, 40, 0.25);
            transform: translateY(-3px);
        }

        h2 {
            font-weight: 500;
            font-size: 1.8rem;
            color: #1a2e4a;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        .parrafo-container {
            background: #ffffffdd;
            border-radius: 28px;
            padding: 1.8rem 1.5rem;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #miParrafo {
            font-size: 1.4rem;
            line-height: 1.6;
            color: #0b1e2e;
            font-weight: 450;
            margin: 0;
            transition: color 0.25s ease;
            word-break: break-word;
        }

        /* estado vacío: texto sutil */
        #miParrafo:empty::before {
            content: "📄 El párrafo está vacío";
            color: #8a9eb0;
            font-weight: 400;
            font-size: 1.1rem;
            letter-spacing: 0.3px;
            opacity: 0.8;
        }

        /* botón con estilo moderno */
        .btn-actualizar {
            background: #1a3a5c;
            border: none;
            padding: 1rem 2.2rem;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 18px rgba(26, 58, 92, 0.25);
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-actualizar:hover {
            background: #0f2a44;
            box-shadow: 0 12px 24px rgba(15, 42, 68, 0.35);
            transform: scale(1.02);
        }

        .btn-actualizar:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(15, 42, 68, 0.3);
        }

        .btn-actualizar::after {
            content: "✨";
            font-size: 1.2rem;
            margin-left: 6px;
        }

        /* pie de página sutil */
        .footer-note {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #5f7488;
            opacity: 0.7;
            letter-spacing: 0.2px;
        }

        /* accesibilidad: focus */
        .btn-actualizar:focus-visible {
            outline: 3px solid #0f2a44;
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.2rem;
            }
            #miParrafo {
                font-size: 1.2rem;
            }
            .btn-actualizar {
                font-size: 1.1rem;
                padding: 0.8rem 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📌 Cambia el texto</h2>

        <!-- Párrafo vacío (sin contenido) -->
        <div class="parrafo-container">
            <p id="miParrafo"></p>
        </div>

        <!-- Botón que dispara la actualización -->
        <button id="btnActualizar" class="btn-actualizar">Actualizar párrafo</button>

        <div class="footer-note">Haz clic para cambiar el contenido</div>
    </div>

    <script>
        (function() {
            "use strict";

            // Referencias al DOM
            const parrafo = document.getElementById('miParrafo');
            const boton = document.getElementById('btnActualizar');

            // Texto que se asignará al párrafo
            const TEXTO_NUEVO = "¡Texto actualizado con Javascript!";

            // Función que actualiza el contenido del párrafo
            function actualizarParrafo() {
                // Asignamos el nuevo texto
                parrafo.textContent = TEXTO_NUEVO;

                // (Opcional) Si deseas que el pseudo-elemento ::before desaparezca,
                // al tener texto ya no se muestra, porque :empty ya no aplica.
                // También podemos forzar un pequeño efecto visual (animación)
                parrafo.style.transition = 'color 0.2s';
                parrafo.style.color = '#0b2b44';
                // Pequeño destello (opcional)
                parrafo.style.transform = 'scale(0.99)';
                setTimeout(() => {
                    parrafo.style.transform = 'scale(1)';
                }, 100);
            }

            // Asignar el evento 'click' al botón
            boton.addEventListener('click', actualizarParrafo);

            // (Opcional) Si se quiere que el párrafo se actualice también con la tecla Enter 
            // cuando el botón tenga foco, ya es nativo del botón (click con Enter/Espacio).
            // También podemos prevenir que el usuario pueda modificar el contenido manualmente
            // (no es necesario, pero añadimos un pequeño detalle: si alguien edita desde consola, no importa)

            // Nota: El párrafo está vacío inicialmente, y el CSS muestra un texto fantasma con ::before
            // cuando está vacío. Al actualizar, el texto real reemplaza al fantasma.
            console.log('✅ Página cargada. Haz clic en el botón para actualizar el párrafo.');
        })();
    </script>
</body>
</html>
